<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>依頼プロンプト作成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7FA; --sheet:#FFFFFF; --ink:#1D2836; --sub:#5F6B7A; --line:#D9DFE7;
  --accent:#2F6FD0; --focus:#2F6FD0; --done:#2E8B57;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141A22; --sheet:#1C242F; --ink:#E6EBF1; --sub:#9AA6B4; --line:#334050;
    --accent:#6E9FEA; --focus:#7FA9EE; --done:#5DBB86; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141A22; --sheet:#1C242F; --ink:#E6EBF1; --sub:#9AA6B4; --line:#334050;
  --accent:#6E9FEA; --focus:#7FA9EE; --done:#5DBB86; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;font-size:16px;line-height:1.75}
.wrap{max-width:780px;margin:0 auto;padding:32px 20px 80px}
h1{font-family:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:900;
  font-size:clamp(28px,6vw,40px);line-height:1.3;margin:0 0 8px}
.lead{color:var(--sub);margin:0 0 24px;max-width:36em}
.steps{list-style:none;padding:0;margin:0 0 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.step{font:inherit;width:100%;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center;
  background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.num{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;
  border:1.5px solid var(--sub);color:var(--sub);font-size:15px}
.step b{display:block;font-size:15px;line-height:1.4}
.step small{display:block;color:var(--sub);font-size:12px;line-height:1.4}
.step[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.step[aria-pressed="true"] .num{background:var(--accent);border-color:var(--accent);color:#fff}
.step.used .num{border-color:var(--done);color:var(--done)}
.step[aria-pressed="true"].used .num{color:#fff}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px 18px 6px;margin-bottom:18px}
h2{font-size:19px;margin:0 0 4px}
.desc{color:var(--sub);font-size:14px;margin:0 0 14px}
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;margin-bottom:4px}
.field .help{display:block;color:var(--sub);font-size:13px;margin:-2px 0 6px}
.shared{font-size:12px;font-weight:500;color:var(--accent);margin-left:6px}
input[type=text],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:6px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
textarea.big{min-height:200px}
.attach{background:var(--paper);border:1px dashed var(--sub);border-radius:6px;padding:10px 12px;font-size:14px;color:var(--sub);margin-bottom:16px}
.out{margin-top:4px}
.out textarea{min-height:260px;background:var(--paper);font-size:14px;line-height:1.7}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 14px}
button.act{font:inherit;font-weight:700;border-radius:6px;padding:10px 16px;cursor:pointer;border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet)}
button.ghost{background:transparent;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--sheet);padding:8px 16px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>依頼プロンプト作成</h1>
  <p class="lead">依頼内容を選んで空欄を埋めると、AIに送るプロンプトができあがります。原稿・キーワード・テンプレートの種類は6つの依頼で共通なので、一度入れれば次の依頼にも引き継がれます。</p>

  <ul class="steps" id="steps"></ul>

  <div class="sheet" id="form"></div>

  <div class="sheet out">
    <h2>できあがったプロンプト</h2>
    <p class="desc">内容を確認してコピーし、AIに貼り付けてください。</p>
    <textarea id="result" readonly aria-label="できあがったプロンプト"></textarea>
    <div class="actions">
      <button class="act" id="copy">プロンプトをコピー</button>
      <button class="act ghost" id="clear">入力をすべて消す</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- テンプレート（PDFの内容） ---------- */
const TEMPLATES = {
"ポートフォリオ①ツール":
`# ポートフォリオ①ツール｜〇〇を△△にするツール「□□」の作り方

こんにちは、初心者マーケターまとです。

結論から言うと、〇〇するだけで△△ができるツール「□□」を作りました。
〇〇に困っている人が、今日から同じものを作れるように、作り方まで紹介します。

【スライド】

## 作ったきっかけ
（自分が困った具体的な場面を1つ。そのとき感じたこと）

## できること
（読者目線で3〜4個。「〇〇を入れるだけで△△ができる」の形で）

## すぐ真似できる作り方
使ったもの：（ツール名・費用）
1. （手順1）
2. （手順2）
3. （手順3）
かかった時間：（〇時間）

使ったプロンプト：
（実際にAIに送った指示をそのまま）

## 工夫したところ
（こだわった点を1〜3個。なぜそうしたかも書く）

## つまずいたところと学び
（うまくいかなかったこと → どう解決したか、またはあきらめたか）
今回の学び：（一文で）

## 使うときの注意
（費用・安全面・個人情報など）

## さいごに
（このツールで次にやりたいこと）

【スライド】

今日もまとの等身大の記録を読んでいただき、ありがとうございました。
〇〇してもらえると、次の記事を書く励みになります。`,
"ポートフォリオ②仕事":
`# ポートフォリオ②仕事｜〇〇の案件で、△△を□□した話

こんにちは、初心者マーケターまとです。

結論から言うと、〇〇の案件で△△を経験し、□□が大事だと分かりました。
これから副業を始める人が、最初の1件で迷わないための記録です。

【スライド】

## どんな仕事だったか
種類：（リサーチ・データ整理など）
使ったサービス：（クラウドワークス／ランサーズ）
かかった時間：（〇時間）

## 受けるまでにやったこと
（探し方・提案文で工夫したこと）

## 進め方
1. （手順1）
2. （手順2）
3. （手順3）
使ったツール・AI：（あれば）

## つまずいたところと学び
（うまくいかなかったこと → どう対応したか）
今回の学び：（一文で）

## 次の仕事で試すこと
（具体的に1つ）

【スライド】

今日もまとの等身大の記録を読んでいただき、ありがとうございました。
〇〇してもらえると、次の記事を書く励みになります。`,
"学習":
`〇〇学習△｜（テーマ）とは？初心者が□□で理解した
こんにちは、初心者マーケターまとです。
「〇〇学習」シリーズ第△回です。前回は（前回のテーマ）を学びました。
結論から言うと、（今回のテーマ）は△△のことです。`
};
const SERIES_COLOR = {"ポートフォリオ①ツール":"青","ポートフォリオ②仕事":"緑","学習":"オレンジ"};

/* ---------- 入力欄の定義（shared は6つの依頼で共通） ---------- */
const FIELDS = {
  tpl:{label:"テンプレートの種類", type:"select", options:Object.keys(TEMPLATES), shared:true},
  report:{label:"報告書の内容", type:"textarea", big:true, help:"スプレッドシートの該当行（仕様書・マニュアル・感想・一言コメントなど）を貼り付け"},
  draft:{label:"note原稿", type:"textarea", big:true, shared:true, help:"①で作った原稿、または今の原稿を貼り付け"},
  keywords:{label:"キーワード（3つ）", type:"text", shared:true, help:"②で出たものを読点「、」で区切って入力"},
  fixes:{label:"修正してほしいこと", type:"textarea", help:"例：結論をもっと短く。つまずいたところに数字を入れて"},
  title:{label:"記事タイトル", type:"text", shared:true},
  url:{label:"noteの記事URL", type:"text", shared:true, help:"公開前なら空欄で大丈夫です"},
  imgUse:{label:"画像の使い道", type:"select", options:["note見出し画像（1280×670）","スライド1枚目（16:9）","Instagram投稿（1080×1350）"]},
  instaType:{label:"Instagramの形式", type:"select", options:["1枚画像","カルーセル（5枚）"]},
  liGoal:{label:"LinkedInで伝えたいこと", type:"select", options:["作ったもの・実績を見てほしい","学びを共有したい","仲間・つながりを増やしたい"]}
};

/* ---------- 6つの依頼 ---------- */
const TASKS = [
 {id:"draft", name:"note原稿を作る", sub:"報告書＋テンプレート", fields:["tpl","report"],
  build:v=>`あなたはnote記事の編集者です。以下の「報告書」の内容だけを使って、「テンプレート」の空欄（〇〇、△△、□□、かっこ内の説明）を埋め、note記事の原稿を作ってください。

# 守ること
・テンプレートの見出しと順番は変えない
・書き手は「初心者マーケターまと」、一人称は「私」、です・ます調
・報告書にない事実・数字・体験は足さない。足りない部分は【要追記：何が必要か】と書いて残す
・1文は短く、専門用語には一言の説明を付ける
・「ギアを上げる」「最前線」などの決まり文句や大げさな表現は使わない
・【スライド】の位置はそのまま残す

# テンプレート（${v.tpl}）
${TEMPLATES[v.tpl]||""}

# 報告書
${v.report||"（ここに報告書を貼る）"}`},
 {id:"kw", name:"キーワードを3つ抽出", sub:"原稿から", fields:["draft"],
  build:v=>`以下のnote原稿から、記事の内容を表すキーワードを3つ選んでください。

# 条件
・1つは10文字以内
・読者が検索しそうな言葉、または画像に載せて目を引く言葉を優先する
・原稿に出てくる言葉か、その言いかえにする

# 出力の形
1. キーワード：選んだ理由（一文）
2. キーワード：選んだ理由（一文）
3. キーワード：選んだ理由（一文）
最後に、3つを読点「、」でつないだ1行も出してください。

# 原稿
${v.draft||"（ここに原稿を貼る）"}`},
 {id:"layout", name:"note仕様にレイアウト", sub:"修正を加えながら", fields:["draft","fixes"],
  build:v=>`以下のnote原稿に「修正してほしいこと」を反映し、noteの編集画面にそのまま貼れる形に整えてください。

# 修正してほしいこと
${v.fixes||"（特になし。読みやすさだけ整える）"}

# noteのレイアウトのルール
・「#」「##」などの記号は使わない。大見出しの行頭に【大見出し】、小見出しの行頭に【小見出し】と付ける（あとでnoteの見出し機能に変えるため）
・1段落は3文以内。段落の間は1行空ける
・強調したい一文だけ【太字】と付ける（記事全体で3か所まで）
・手順は「1.」「2.」の番号付きにする
・【スライド】の位置はそのまま残す
・内容・数字・体験は修正指示がある部分以外は変えない

# 出力
1. 整えた原稿
2. 何を変えたかの箇条書き（5行以内）

# 原稿
${v.draft||"（ここに原稿を貼る）"}`},
 {id:"img", name:"画像にキーワードを入れる", sub:"手持ちの画像を使う", fields:["keywords","title","tpl","imgUse"], attach:true,
  build:v=>`添付した画像に、文字を入れてください。

# 入れる文字
・メイン：${v.keywords||"（キーワード3つ）"}
・サブ（小さめ）：${v.title||"（記事タイトル）"}
・右下にごく小さく：初心者マーケターまと

# 条件
・画像の用途：${v.imgUse}
・元の画像の主役（人・物・画面）に文字をかぶせない
・スマホの小さい画面でも読める太さと大きさにする
・文字の色は画像に合わせて、読みにくい場合は文字の後ろに半透明の帯を敷く
・アクセントカラーは${SERIES_COLOR[v.tpl]||"青"}系にする
・キーワード以外の文字や装飾は足さない
・元の画像の内容は変えない`},
 {id:"insta", name:"Instagram用の画像を作る", sub:"キーワードと要点から", fields:["keywords","title","tpl","instaType","draft"],
  build:v=>`以下の内容で、Instagram投稿用の画像を作ってください。

# 形式
${v.instaType==="カルーセル（5枚）"
? `カルーセル5枚（各1080×1350）
1枚目：タイトル「${v.title||"（記事タイトル）"}」とキーワード
2〜4枚目：原稿の要点を1枚1つずつ（1枚40字以内）
5枚目：「続きはnoteで」と「初心者マーケターまと」`
: `1枚（1080×1350）
タイトル「${v.title||"（記事タイトル）"}」と、キーワード3つを大きく配置`}

# キーワード
${v.keywords||"（キーワード3つ）"}

# デザインの条件
・アクセントカラーは${SERIES_COLOR[v.tpl]||"青"}系、背景は白か薄いグレー
・文字はスマホで読める大きさ。1枚に情報を詰めすぎない
・右下に小さく「初心者マーケターまと」
・原稿にない内容や数字は入れない

# 原稿（要点の参考）
${v.draft||"（ここに原稿を貼る）"}

画像のあとに、投稿の本文（150字以内）とハッシュタグ5つも提案してください。`},
 {id:"li", name:"LinkedIn用の投稿文", sub:"原稿から", fields:["draft","url","liGoal"],
  build:v=>`以下のnote原稿をもとに、LinkedInの投稿文を作ってください。

# 書き手
来春MAツール企業に入社予定の大学4年生「初心者マーケターまと」。等身大の成長を公開している。

# 目的
${v.liGoal}

# 条件
・300〜500字、日本語
・1行目で目を引く（問いかけ、または結果の数字）
・「何をしたか → 何を学んだか → 読んだ人へのひとこと」の順
・ビジネス向けの丁寧さは保ちつつ、背伸びした表現や誇張はしない
・原稿にない実績や数字は書かない
・最後に記事リンク：${v.url||"（noteのURL）"}
・ハッシュタグは3〜5個

違うトーンで2案出してください。

# 原稿
${v.draft||"（ここに原稿を貼る）"}`}
];

/* ---------- 状態 ---------- */
const $=id=>document.getElementById(id);
function load(){try{return JSON.parse(localStorage.getItem("prompt:state")||"{}")}catch(e){return {}}}
function save(){try{localStorage.setItem("prompt:state",JSON.stringify(state))}catch(e){}}
let state=Object.assign({values:{}, used:[]}, load());
let current=null;

function val(k){
  const f=FIELDS[k];
  if(state.values[k]!==undefined && state.values[k]!=="") return state.values[k];
  return f.type==="select"?f.options[0]:"";
}

TASKS.forEach((t,i)=>{
  const li=document.createElement("li");
  li.innerHTML=`<button class="step" data-id="${t.id}" aria-pressed="false"><span class="num">${i+1}</span><span><b>${t.name}</b><small>${t.sub}</small></span></button>`;
  li.querySelector("button").addEventListener("click",()=>{location.hash=t.id; select(t.id)});
  $("steps").appendChild(li);
});

function select(id){
  const t=TASKS.find(x=>x.id===id)||TASKS[0];
  current=t;
  document.querySelectorAll(".step").forEach(b=>{
    b.setAttribute("aria-pressed",b.dataset.id===t.id);
    b.classList.toggle("used",state.used.includes(b.dataset.id));
  });
  const n=TASKS.indexOf(t)+1;
  let html=`<h2>${n}. ${t.name}</h2><p class="desc">空欄を埋めると、下のプロンプトがすぐに更新されます。</p>`;
  if(t.attach) html+=`<div class="attach">この依頼は画像を作れるAI（ChatGPTやGeminiなど）を使います。プロンプトを貼るときに、文字を入れたい画像ファイルも一緒に添付してください。</div>`;
  t.fields.forEach(k=>{
    const f=FIELDS[k], v=val(k);
    html+=`<div class="field"><label for="f-${k}">${f.label}${f.shared?'<span class="shared">共通</span>':""}</label>${f.help?`<span class="help">${f.help}</span>`:""}`;
    if(f.type==="select") html+=`<select id="f-${k}" data-k="${k}">${f.options.map(o=>`<option${o===v?" selected":""}>${o}</option>`).join("")}</select>`;
    else if(f.type==="textarea") html+=`<textarea id="f-${k}" data-k="${k}" class="${f.big?"big":""}"></textarea>`;
    else html+=`<input type="text" id="f-${k}" data-k="${k}">`;
    html+=`</div>`;
  });
  $("form").innerHTML=html;
  t.fields.forEach(k=>{
    const el=$("f-"+k);
    if(FIELDS[k].type!=="select") el.value=val(k);
    el.addEventListener("input",()=>{state.values[k]=el.value;save();render()});
    el.addEventListener("change",()=>{state.values[k]=el.value;save();render()});
  });
  render();
}
function render(){
  const v={}; Object.keys(FIELDS).forEach(k=>v[k]=val(k));
  $("result").value=current.build(v);
}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)}

$("copy").addEventListener("click",async()=>{
  const text=$("result").value;
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true}catch(e){
    const r=$("result");r.focus();r.select();try{ok=document.execCommand("copy")}catch(_){}
  }
  toast(ok?"コピーしました":"選択された文字をコピーしてください");
  if(ok && !state.used.includes(current.id)){state.used.push(current.id);save();
    document.querySelector(`.step[data-id="${current.id}"]`).classList.add("used");}
});
$("clear").addEventListener("click",()=>{
  if(!confirm("入力した内容をすべて消して、次の記事用にしますか？"))return;
  state={values:{},used:[]};save();select(current.id);toast("消しました");
});

window.addEventListener("hashchange",()=>select(location.hash.slice(1)));
select(location.hash.slice(1)||"draft");
</script>
</body>
</html>
